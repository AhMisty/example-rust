# Pin the build toolchain exactly. `rust-version` declares the supported compiler version and participates in dependency resolution, but it does not select or install a toolchain; this file is the source of truth for the exact build toolchain.
# 精确固定构建工具链；rust-version 声明支持的编译器版本并参与依赖解析，但不会选择或安装工具链；本文件是精确构建工具链的唯一来源。
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
